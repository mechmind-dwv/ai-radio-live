<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Peticiones | AI RADIO LIVE</title><link rel="stylesheet" href="/assets/style.css"></head><body><header class="top"><a class="brand" href="/">◉ AI RADIO <span>LIVE</span></a><nav><a href="/">Directo</a><a class="active" href="/peticiones.html">Peticiones</a></nav><a class="admin-link" href="/">Volver a radio</a></header><main class="form-wrap"><div class="eyebrow"><i></i> ESTUDIO ABIERTO</div><h1>DALE FORMA<br><em>A TU SONIDO.</em></h1><p class="lead">Describe la canción que tienes en la cabeza. Nuestro equipo revisará tu propuesta para convertirla en música original.</p><form id="requestform" class="request-form"><label>Tu alias<input name="alias" maxlength="40" required placeholder="¿Cómo te llamamos?"></label><label>Género musical<select name="genre" required><option value="">Selecciona un género</option><option>Breakbeat</option><option>Jungle / Drum & Bass</option><option>Techno / Electrónica</option><option>Hip-hop / Rap</option><option>Flamenco fusión</option><option>Rock</option><option>Ambient / Experimental</option><option>Pop</option><option>Otro / Fusión</option></select></label><label>Estilo o referencias<input name="style" maxlength="160" placeholder="Ej. oscuro, andaluz, orgánico, futurista..."></label><label>¿De qué trata la canción?<input name="theme" maxlength="100" required placeholder="La idea central de tu canción"></label><div class="two"><label>Idioma<select name="language"><option>Español</option><option>Inglés</option><option>Instrumental</option><option>Otro</option></select></label><label>Tipo de voz<select name="voice"><option>Indiferente</option><option>Masculina</option><option>Femenina</option><option>Dúo</option><option>Instrumental</option></select></label></div><label>Ambiente<select name="mood"><option value="">Elige una emoción</option><option>Enérgico</option><option>Oscuro</option><option>Melancólico</option><option>Festivo</option><option>Épico</option><option>Relajante</option><option>Combativo</option></select></label><label>Detalles adicionales<textarea name="details" maxlength="1000" rows="4" placeholder="Instrumentos, ritmo, mensaje, estructura..."></textarea></label><button class="button" type="submit">ENVIAR PETICIÓN ↗</button><p id="formmsg" class="hint" aria-live="polite"></p></form><section class="lookup"><h2>CONSULTA TU PETICIÓN</h2><form id="lookupform"><input name="code" required placeholder="Ej. AIR-ABC1234"><button class="button secondary">CONSULTAR</button></form><p id="lookupresult" class="hint"></p></section></main><footer><span>© AI RADIO LIVE</span><span>TU IDEA PUEDE SONAR AQUÍ</span></footer><script src="/assets/requests.js"></script></body></html>
